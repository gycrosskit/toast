name: Component regression
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release tag to verify (empty runs source regression)
        type: string
        required: false
permissions:
  contents: read
# JVM 启动前设置；Gradle init 时 DNS 策略可能已初始化，不能在那时才改。
env:
  # 为 URLConnection 下载设置等待上限；失败仍使真实构建/测试门禁失败。
  JAVA_TOOL_OPTIONS: >-
    -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security
    -Dsun.net.client.defaultConnectTimeout=30000
    -Dsun.net.client.defaultReadTimeout=60000
concurrency:
  group: regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: npm install --prefix "$RUNNER_TEMP/ci-tools" --ignore-scripts --no-audit --no-fund typescript@4.9.5
      - run: |
          python3 tests/test_metadata.py
          TYPESCRIPT_PATH="$RUNNER_TEMP/ci-tools/node_modules/typescript" node --test tests/kuikly-module.cjs
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - run: bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :toast:testDebugUnitTest :toast:compileDebugKotlinAndroid :toast-cmp:compileDebugKotlinAndroid --no-daemon --max-workers=1
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: |
          case "$(uname -m)" in
            arm64) native_target=IosSimulatorArm64; native_test=iosSimulatorArm64Test ;;
            x86_64) native_target=IosX64; native_test=iosX64Test ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :toast:compileKotlinIosArm64 :toast:compileKotlin${native_target} :toast-cmp:compileKotlin${native_target} :toast:${native_test} :toast:compileKotlinOhosArm64 :toast-kuikly:compileKotlinOhosArm64 --no-daemon --max-workers=1
          python3 - "toast-core/build/test-results/$native_test" <<'TEST_RESULTS'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path(sys.argv[1]).glob('TEST-*.xml'))
          assert reports, 'Native test reports are missing; skipped target is not a pass'
          cases = [case for report in reports for case in ET.parse(report).getroot().iter('testcase')]
          executed = [case for case in cases if case.find('skipped') is None]
          assert executed, 'No native test case executed'
          assert all(case.find('failure') is None and case.find('error') is None for case in executed)
          print(f'Native cases: {len(executed)} executed, {len(cases)-len(executed)} skipped')
          TEST_RESULTS
      - run: xcrun swiftc -typecheck -target "$(uname -m)-apple-ios15.0-simulator" -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" iosApp/Sources/GycToastNative/*.swift
  release-android:
    if: github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version || '0.1.3' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - run: bash scripts/ci-release.sh
      - run: bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification compileDebugKotlinAndroid -PtoastVersion="$VERSION" -PverifyCmp=true --refresh-dependencies --no-daemon --max-workers=1
  release-native:
    if: github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version || '0.1.3' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-release.sh
      - run: |
          case "$(uname -m)" in
            arm64) native_target=IosSimulatorArm64; native_test=iosSimulatorArm64Test ;;
            x86_64) native_target=IosX64; native_test=iosX64Test ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification linkDebugFramework${native_target} -PtoastVersion="$VERSION" -PverifyCmp=true --refresh-dependencies --no-daemon --max-workers=1
          bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification compileKotlinOhosArm64 -PtoastVersion="$VERSION" --refresh-dependencies --no-daemon --max-workers=1
