name: Component regression
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      warm_native_cache:
        description: Warm Native toolchains on main only (leave version empty)
        type: boolean
        default: false
      version:
        description: Immutable release tag to verify (empty runs source regression)
        type: string
        required: false
permissions:
  contents: read
# JVM 启动前设置；Gradle init 时 DNS 策略可能已初始化，不能在那时才改。
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  # 为 URLConnection 下载设置等待上限；失败仍使真实构建/测试门禁失败。
  JAVA_TOOL_OPTIONS: >-
    -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security
    -Dsun.net.client.defaultConnectTimeout=30000
    -Dsun.net.client.defaultReadTimeout=60000
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.scope.outputs.source }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci-changes.py
      - run: |
          mkdir -p ci-diagnostics
          printf 'event=%s\nsource=%s\n' "$GITHUB_EVENT_NAME" "${{ steps.scope.outputs.source }}" > ci-diagnostics/scope.txt
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  verify-public:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
      CI_DIAGNOSTICS_DIR: ${{ github.workspace }}/ci-diagnostics
      VERIFY_OHOS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check exact frozen archive and public publications once
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        timeout-minutes: 30
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/verify-public.log -- bash scripts/ci-release.sh
      - if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'Public artifact validation runs for Release or an explicit version dispatch.'
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  contracts:
    if: always()
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful scope detection
        run: test "${{ needs.changes.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: npm install --prefix "$RUNNER_TEMP/ci-tools" --ignore-scripts --no-audit --no-fund typescript@4.9.5
        timeout-minutes: 5
        if: needs.changes.outputs.source == 'true'
      - timeout-minutes: 8
        if: needs.changes.outputs.source == 'true'
        run: |
          python3 tests/test_metadata.py
          TYPESCRIPT_PATH="$RUNNER_TEMP/ci-tools/node_modules/typescript" node --test tests/kuikly-module.cjs
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Check fork host trust boundaries
        if: needs.changes.outputs.source == 'true'
        run: python3 verification/ci/test_fork_host.py
      - name: Check CI shell syntax
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/ci-python-cache" python3 -m py_compile scripts/ci-changes.py scripts/ci-run.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  android:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: needs.changes.outputs.source == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
        timeout-minutes: 35
        if: needs.changes.outputs.source == 'true'
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: needs.changes.outputs.source == 'true'
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :toast:testDebugUnitTest :toast-kuikly:testDebugUnitTest :toast:compileDebugKotlinAndroid :toast-cmp:compileDebugKotlinAndroid :toast-kuikly:compileDebugKotlinAndroid --no-daemon --max-workers=1
        timeout-minutes: 35
        if: needs.changes.outputs.source == 'true'
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  native:
    needs: changes
    runs-on: ${{ ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Identify Native toolchain and Xcode
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore completed Kotlin Native toolchain
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
      - timeout-minutes: 45
        if: needs.changes.outputs.source == 'true'
        run: |
          case "$(uname -m)" in
            arm64) native_target=IosSimulatorArm64; native_test=iosSimulatorArm64Test ;;
            x86_64) native_target=IosX64; native_test=iosX64Test ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info :toast:compileKotlinIosArm64 :toast:compileKotlin${native_target} :toast-cmp:compileKotlin${native_target} :toast:${native_test} :toast:compileKotlinOhosArm64 :toast-kuikly:compileKotlinIosArm64 :toast-kuikly:compileKotlin${native_target} :toast-kuikly:compileKotlinOhosArm64 --no-daemon --max-workers=1
          python3 - "toast-core/build/test-results/$native_test" <<'TEST_RESULTS'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path(sys.argv[1]).glob('TEST-*.xml'))
          assert reports, 'Native test reports are missing; skipped target is not a pass'
          cases = [case for report in reports for case in ET.parse(report).getroot().iter('testcase')]
          executed = [case for case in cases if case.find('skipped') is None]
          assert executed, 'No native test case executed'
          assert all(case.find('failure') is None and case.find('error') is None for case in executed)
          print(f'Native cases: {len(executed)} executed, {len(cases)-len(executed)} skipped')
          TEST_RESULTS
      - name: Compile native Module against the pinned real Renderer SDK
        run: |
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-module.log -- bash scripts/ci-build-kuikly-render.sh "$RUNNER_TEMP/toast-native-render" GycToastNative/Kuikly
        timeout-minutes: 10
        if: needs.changes.outputs.source == 'true'
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Warm trusted main Native cache
        if: (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main') && steps.konan.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-warmup.log -- python3 scripts/ci-native-cache.py
      - name: Cache only successful Native downloads
        if: success() && ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  release-android:
    if: always()
    needs: [changes, verify-public]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Require successful scope and public verification
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
        timeout-minutes: 35
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - timeout-minutes: 35
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          unified_ui=true
          case "$VERSION" in 0.1.3) unified_ui=false ;; esac
          native_module=true
          case "$VERSION" in 0.1.[0-5]) native_module=false ;; esac
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification compileDebugKotlinAndroid -PtoastVersion="$VERSION" -PverifyCmp=true -PverifyUnifiedUi="$unified_ui" -PverifyNativeModule="$native_module" --refresh-dependencies --no-daemon --max-workers=1
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'No build is required for this event and scope.'
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  release-native:
    if: always()
    needs: [changes, verify-public]
    runs-on: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Require successful scope and public verification
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Identify Native toolchain and Xcode
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore completed Kotlin Native toolchain
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          python3 verification/ci/test_fork_host.py
          bash scripts/ci-pin-fork-host.sh
      - timeout-minutes: 45
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          case "$(uname -m)" in
            arm64) native_target=IosSimulatorArm64; native_test=iosSimulatorArm64Test ;;
            x86_64) native_target=IosX64; native_test=iosX64Test ;;
            *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
          esac
          unified_ui=true
          case "$VERSION" in 0.1.3) unified_ui=false ;; esac
          native_module=true
          case "$VERSION" in 0.1.[0-5]) native_module=false ;; esac
          render_args=()
          if [[ "$unified_ui" == true ]]; then
            if [[ "$native_module" == true ]]; then
              render_dir=$(bash scripts/ci-build-kuikly-render.sh "$RUNNER_TEMP/kuikly-ios-render" GycToastNative/Kuikly toast "$VERSION")
            else
              render_dir=$(bash scripts/ci-build-kuikly-render.sh "$RUNNER_TEMP/kuikly-ios-render")
            fi
            render_args=("-PkuiklyRenderFrameworkDir=$render_dir")
          fi
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification linkDebugFramework${native_target} -PtoastVersion="$VERSION" -PverifyCmp=true -PverifyUnifiedUi="$unified_ui" "${render_args[@]}" --refresh-dependencies --no-daemon --max-workers=1
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info -p verification compileKotlinOhosArm64 -PtoastVersion="$VERSION" -PverifyUnifiedUi="$unified_ui" --no-daemon --max-workers=1 --stacktrace
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'No build is required for this event and scope.'
      - name: Cache only successful Native downloads
        if: success() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
